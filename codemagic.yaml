# Build cloud di In Iure con Codemagic (https://codemagic.io) — nessun Mac necessario.
# Prerequisito: repository git con questa cartella "Sito web" come radice.
# iOS nativo ELIMINATO il 09/11/2026 (nessuna pubblicazione su App Store): per iPhone si usa la versione web da GitHub Pages.
workflows:
  android-release:
    name: In Iure Android (AAB per Google Play)
    instance_type: linux_x2
    max_build_duration: 45
    working_directory: In-Iure-App
    environment:
      android_signing:
        - iniure_upload   # caricare signing/iniure-upload.jks in Codemagic con questo nome
      java: 21
      node: 22
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Dipendenze
        script: npm ci
      - name: Copia web-app e sincronizza Android
        script: |
          node scripts/copy-web.js
          npx cap sync android
      - name: Compila AAB firmato
        script: |
          mkdir -p signing
          cat > signing/keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab

  desktop-mac:
    name: In Iure Desktop macOS (.dmg)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: In-Iure-Desktop
    environment:
      node: 22
      # Facoltativo, per evitare l'avviso di Gatekeeper: certificato "Developer ID Application"
      # (variabili CSC_LINK / CSC_KEY_PASSWORD) e notarizzazione (APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER).
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Dipendenze
        script: |
          npm ci
          (cd ../In-Iure-App && npm ci)
      - name: Compila DMG
        script: npm run dist:mac
    artifacts:
      - INSTALLER/*.dmg

  desktop-linux:
    name: In Iure Desktop Linux (AppImage + deb)
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: In-Iure-Desktop
    environment:
      node: 22
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Dipendenze
        script: |
          npm ci
          (cd ../In-Iure-App && npm ci)
      - name: Compila AppImage e deb
        script: npm run dist:linux
    artifacts:
      - INSTALLER/*.AppImage
      - INSTALLER/*.deb
