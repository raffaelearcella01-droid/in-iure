# Build cloud di In Iure con Codemagic (https://codemagic.io) — nessun Mac necessario.
# Prerequisiti (una tantum, vedi In-Iure-App/GUIDA_APP_STORE.md):
#  1. Repository git con questa cartella "Sito web" come radice (In-Iure + In-Iure-App).
#  2. Account Apple Developer + app "In Iure" creata in App Store Connect con bundle id it.iniure.app.
#  3. In Codemagic: Teams > Integrations > Developer Portal > chiave API App Store Connect
#     salvata con il nome indicato sotto in "app_store_connect".
workflows:
  ios-release:
    name: In Iure iOS (App Store / TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: In-Iure-App
    integrations:
      app_store_connect: In Iure ASC Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.iniure.app
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 0   # sostituire con l'Apple ID numerico dell'app (App Store Connect > Informazioni app)
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Dipendenze
        script: npm ci
      - name: Copia web-app e sincronizza iOS
        script: |
          node scripts/copy-web.js
          npx cap sync ios
      - name: Profili di firma
        script: xcode-project use-profiles
      - name: Numero di build progressivo
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Compila IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-release:
    name: In Iure Android (AAB per Google Play)
    instance_type: linux_x2
    max_build_duration: 45
    working_directory: In-Iure-App
    environment:
      android_signing:
        - iniure_upload   # caricare signing/iniure-upload.jks in Codemagic con questo nome
      java: 21
      node: 22
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Dipendenze
        script: npm ci
      - name: Copia web-app e sincronizza Android
        script: |
          node scripts/copy-web.js
          npx cap sync android
      - name: Compila AAB firmato
        script: |
          mkdir -p signing
          cat > signing/keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab

  desktop-mac:
    name: In Iure Desktop macOS (.dmg)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: In-Iure-Desktop
    environment:
      node: 22
      # Facoltativo, per evitare l'avviso di Gatekeeper: certificato "Developer ID Application"
      # (variabili CSC_LINK / CSC_KEY_PASSWORD) e notarizzazione (APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER).
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Dipendenze
        script: |
          npm ci
          (cd ../In-Iure-App && npm ci)
      - name: Compila DMG
        script: npm run dist:mac
    artifacts:
      - INSTALLER/*.dmg

  desktop-linux:
    name: In Iure Desktop Linux (AppImage + deb)
    instance_type: linux_x2
    max_build_duration: 30
    working_directory: In-Iure-Desktop
    environment:
      node: 22
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: "v*"
    scripts:
      - name: Dipendenze
        script: |
          npm ci
          (cd ../In-Iure-App && npm ci)
      - name: Compila AppImage e deb
        script: npm run dist:linux
    artifacts:
      - INSTALLER/*.AppImage
      - INSTALLER/*.deb
